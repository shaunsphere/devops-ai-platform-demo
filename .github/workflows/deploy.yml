name: Deploy DevOps Platform

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true

  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Homelab & AWS K3s Cluster
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    runs-on:
      - self-hosted
      - Linux
      - X64
      - devops-demo

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: shaunsphere
          password: ${{ secrets.GHCR_READ_TOKEN }}

      - name: Verify GHCR images
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          echo "================================="
          echo "Testing GHCR Image Pulls..."
          echo "Image tag: ${IMAGE_TAG}"
          echo "================================="

          if [ -z "${IMAGE_TAG}" ]; then
            echo "ERROR: IMAGE_TAG is empty"
            exit 1
          fi

          docker pull "ghcr.io/shaunsphere/hello-server1:${IMAGE_TAG}"
          docker pull "ghcr.io/shaunsphere/hello-server2:${IMAGE_TAG}"
          docker pull "ghcr.io/shaunsphere/hello-server3:${IMAGE_TAG}"
          docker pull "ghcr.io/shaunsphere/hello-server4:${IMAGE_TAG}"
          docker pull "ghcr.io/shaunsphere/hello-server5:${IMAGE_TAG}"

          echo "All 5 GHCR image pulls succeeded."

      - name: Show deployment information
        run: |
          echo "================================="
          echo "DevOps Multi-Cluster Deployment"
          echo "================================="
          echo "Host:      $(hostname)"
          echo "Runner:    $RUNNER_NAME"
          echo "Docker:    $(docker --version)"
          echo "Terraform: $(terraform version | head -n 1)"

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          terraform plan \
            -var="image_tag=${IMAGE_TAG}"

      - name: Terraform Apply
        working-directory: terraform
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          terraform apply \
            -auto-approve \
            -var="image_tag=${IMAGE_TAG}"

      - name: Capture AWS Cluster Outputs from Terraform
        id: tf-outputs
        working-directory: terraform
        run: |
          MASTER_IP=$(terraform output -raw k3s_master_public_ip)
          echo "master_ip=${MASTER_IP}" >> "$GITHUB_OUTPUT"
          echo "server3_url=http://${MASTER_IP}:30003/hello" >> "$GITHUB_OUTPUT"
          echo "server4_url=http://${MASTER_IP}:30004/hello" >> "$GITHUB_OUTPUT"
          echo "server5_url=http://${MASTER_IP}:30005/hello" >> "$GITHUB_OUTPUT"
          echo "server3_health=http://${MASTER_IP}:30003/health" >> "$GITHUB_OUTPUT"
          echo "server4_health=http://${MASTER_IP}:30004/health" >> "$GITHUB_OUTPUT"
          echo "server5_health=http://${MASTER_IP}:30005/health" >> "$GITHUB_OUTPUT"
          echo "AWS K3s Master Public IP: ${MASTER_IP}"

      - name: Verify Server 1 (Homelab)
        run: |
          set -e
          echo "Waiting for Server 1 (Homelab)..."
          for i in {1..15}; do
            if curl --silent --show-error --fail http://localhost:8001/health; then
              echo
              echo "========================================="
              echo "[SUCCESS] Server 1 is healthy!"
              echo "Response:"
              curl -s http://localhost:8001/hello
              echo
              echo "========================================="
              exit 0
            fi
            echo "Server 1 not ready yet... attempt $i/15"
            sleep 2
          done
          echo "[ERROR] Server 1 failed health check."
          docker logs terraform-server1
          exit 1

      - name: Verify Server 2 (Homelab)
        run: |
          set -e
          echo "Waiting for Server 2 (Homelab)..."
          for i in {1..15}; do
            if curl --silent --show-error --fail http://localhost:8002/health; then
              echo
              echo "========================================="
              echo "[SUCCESS] Server 2 is healthy!"
              echo "Response:"
              curl -s http://localhost:8002/hello
              echo
              echo "========================================="
              exit 0
            fi
            echo "Server 2 not ready yet... attempt $i/15"
            sleep 2
          done
          echo "[ERROR] Server 2 failed health check."
          docker logs terraform-server2
          exit 1

      - name: Verify Server 3 (AWS K3s Cluster)
        env:
          HEALTH_URL: ${{ steps.tf-outputs.outputs.server3_health }}
          HELLO_URL: ${{ steps.tf-outputs.outputs.server3_url }}
        run: |
          set -e
          echo "Waiting for Server 3 on AWS K3s (${HEALTH_URL})..."
          for i in {1..30}; do
            if curl --silent --show-error --fail "${HEALTH_URL}"; then
              echo
              echo "========================================="
              echo "[SUCCESS] Server 3 (AWS K3s) is healthy!"
              echo "Response:"
              curl -s "${HELLO_URL}"
              echo
              echo "========================================="
              exit 0
            fi
            echo "Server 3 not ready yet... attempt $i/30"
            sleep 4
          done
          echo "[WARNING] Server 3 not responding on NodePort 30003 (Syncing via ArgoCD)."

      - name: Verify Server 4 (AWS K3s Cluster)
        env:
          HEALTH_URL: ${{ steps.tf-outputs.outputs.server4_health }}
          HELLO_URL: ${{ steps.tf-outputs.outputs.server4_url }}
        run: |
          set -e
          echo "Waiting for Server 4 on AWS K3s (${HEALTH_URL})..."
          for i in {1..30}; do
            if curl --silent --show-error --fail "${HEALTH_URL}"; then
              echo
              echo "========================================="
              echo "[SUCCESS] Server 4 (AWS K3s) is healthy!"
              echo "Response:"
              curl -s "${HELLO_URL}"
              echo
              echo "========================================="
              exit 0
            fi
            echo "Server 4 not ready yet... attempt $i/30"
            sleep 4
          done
          echo "[WARNING] Server 4 not responding on NodePort 30004 (Syncing via ArgoCD)."

      - name: Verify Server 5 (AWS K3s Cluster)
        env:
          HEALTH_URL: ${{ steps.tf-outputs.outputs.server5_health }}
          HELLO_URL: ${{ steps.tf-outputs.outputs.server5_url }}
        run: |
          set -e
          echo "Waiting for Server 5 on AWS K3s (${HEALTH_URL})..."
          for i in {1..30}; do
            if curl --silent --show-error --fail "${HEALTH_URL}"; then
              echo
              echo "========================================="
              echo "[SUCCESS] Server 5 (AWS K3s) is healthy!"
              echo "Response:"
              curl -s "${HELLO_URL}"
              echo
              echo "========================================="
              exit 0
            fi
            echo "Server 5 not ready yet... attempt $i/30"
            sleep 4
          done
          echo "[WARNING] Server 5 not responding on NodePort 30005 (Syncing via ArgoCD)."

      - name: TypeScript Deployment Summary
        uses: ./.github/actions/deployment-summary
        with:
          image-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
          server1-url: http://localhost:8001/hello
          server2-url: http://localhost:8002/hello
          server3-url: ${{ steps.tf-outputs.outputs.server3_url }}
          server4-url: ${{ steps.tf-outputs.outputs.server4_url }}
          server5-url: ${{ steps.tf-outputs.outputs.server5_url }}
