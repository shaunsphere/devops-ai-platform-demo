name: Deploy DevOps Platform

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true

  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Homelab
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    runs-on:
      - self-hosted
      - Linux
      - X64
      - devops-demo

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: shaunsphere
          password: ${{ secrets.GHCR_READ_TOKEN }}

      - name: Verify GHCR images
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          echo "Testing GHCR access..."
          echo "Event: ${{ github.event_name }}"
          echo "Image tag: ${IMAGE_TAG}"

          if [ -z "${IMAGE_TAG}" ]; then
            echo "ERROR: IMAGE_TAG is empty"
            exit 1
          fi

          docker pull "ghcr.io/shaunsphere/hello-server1:${IMAGE_TAG}"
          docker pull "ghcr.io/shaunsphere/hello-server2:${IMAGE_TAG}"

          echo "GHCR image pulls succeeded."

      - name: Show deployment information
        run: |
          echo "================================="
          echo "DevOps Platform Deployment"
          echo "================================="
          echo "Host:"
          hostname

          echo "Runner:"
          echo "$RUNNER_NAME"

          echo "Image tag:"
          echo "${{ steps.version.outputs.tag }}"

          echo "Docker:"
          docker --version

          echo "Terraform:"
          terraform version

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          terraform plan \
            -var="image_tag=${IMAGE_TAG}"

      - name: Terraform Apply
        working-directory: terraform
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          terraform apply \
            -auto-approve \
            -var="image_tag=${IMAGE_TAG}"

      - name: Verify Server 1
        run: |
          echo "Testing Server 1..."
          curl --fail --retry 5 --retry-delay 2 \
            http://localhost:8001/health

      - name: Verify Server 2
        run: |
          echo "Testing Server 2..."
          curl --fail --retry 5 --retry-delay 2 \
            http://localhost:8002/health

      - name: Test Server 1 Hello API
        run: |
          curl --fail http://localhost:8001/hello

      - name: Test Server 2 Hello API
        run: |
          curl --fail http://localhost:8002/hello
