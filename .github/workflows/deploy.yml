name: Deploy DevOps Platform

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true

  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Homelab & AWS
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    runs-on:
      - self-hosted
      - Linux
      - X64
      - devops-demo

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: shaunsphere
          password: ${{ secrets.GHCR_READ_TOKEN }}

      - name: Verify GHCR images
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          echo "Testing GHCR access..."
          echo "Event: ${{ github.event_name }}"
          echo "Image tag: ${IMAGE_TAG}"

          if [ -z "${IMAGE_TAG}" ]; then
            echo "ERROR: IMAGE_TAG is empty"
            exit 1
          fi

          docker pull "ghcr.io/shaunsphere/hello-server1:${IMAGE_TAG}"
          docker pull "ghcr.io/shaunsphere/hello-server2:${IMAGE_TAG}"
          docker pull "ghcr.io/shaunsphere/hello-server3:${IMAGE_TAG}"

          echo "GHCR image pulls succeeded."

      - name: Show deployment information
        run: |
          echo "================================="
          echo "DevOps Platform Deployment"
          echo "================================="
          echo "Host:"
          hostname

          echo "Runner:"
          echo "$RUNNER_NAME"

          echo "Docker:"
          docker --version

          echo "Terraform:"
          terraform version

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          terraform plan \
            -var="image_tag=${IMAGE_TAG}"

      - name: Terraform Apply
        working-directory: terraform
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          terraform apply \
            -auto-approve \
            -var="image_tag=${IMAGE_TAG}"

      - name: Capture Server 3 Endpoint from Terraform
        id: server3-info
        working-directory: terraform
        run: |
          SERVER3_IP=$(terraform output -raw server3_public_ip)
          echo "ip=${SERVER3_IP}" >> "$GITHUB_OUTPUT"
          echo "url=http://${SERVER3_IP}:8000/hello" >> "$GITHUB_OUTPUT"
          echo "health_url=http://${SERVER3_IP}:8000/health" >> "$GITHUB_OUTPUT"
          echo "Discovered AWS Server 3 Public IP: ${SERVER3_IP}"

      - name: Wait for Server 1
        run: |
          set -e

          echo "Waiting for Server 1..."
          for i in {1..15}; do
            if curl --silent --show-error --fail \
              http://localhost:8001/health; then
              echo
              echo "Server 1 is healthy."
              exit 0
            fi

            echo "Server 1 not ready yet... attempt $i/15"
            sleep 2
          done

          echo "Server 1 failed health check."
          docker logs terraform-server1
          exit 1

      - name: Wait for Server 2
        run: |
          set -e

          echo "Waiting for Server 2..."
          for i in {1..15}; do
            if curl --silent --show-error --fail \
              http://localhost:8002/health; then
              echo
              echo "Server 2 is healthy."
              exit 0
            fi

            echo "Server 2 not ready yet... attempt $i/15"
            sleep 2
          done

          echo "Server 2 failed health check."
          docker logs terraform-server2
          exit 1

      - name: Wait for Server 3 (AWS)
        env:
          HEALTH_URL: ${{ steps.server3-info.outputs.health_url }}
        run: |
          set -e

          echo "Waiting for Server 3 on AWS (${HEALTH_URL})..."
          for i in {1..30}; do
            if curl --silent --show-error --fail "${HEALTH_URL}"; then
              echo
              echo "Server 3 (AWS) is healthy."
              exit 0
            fi

            echo "Server 3 (AWS) not ready yet... attempt $i/30"
            sleep 5
          done

          echo "Server 3 (AWS) failed health check."
          exit 1

      - name: Test Server 1 Hello API
        run: |
          curl --fail http://localhost:8001/hello

      - name: Test Server 2 Hello API
        run: |
          curl --fail http://localhost:8002/hello

      - name: Test Server 3 Hello API
        env:
          HELLO_URL: ${{ steps.server3-info.outputs.url }}
        run: |
          curl --fail "${HELLO_URL}"

      - name: TypeScript Deployment Summary
        uses: ./.github/actions/deployment-summary
        with:
          image-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
          server1-url: http://localhost:8001/hello
          server2-url: http://localhost:8002/hello
          server3-url: ${{ steps.server3-info.outputs.url }}
