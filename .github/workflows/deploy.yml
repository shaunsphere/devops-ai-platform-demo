name: Deploy DevOps Platform

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true

  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Homelab
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on:
      - self-hosted
      - Linux
      - X64
      - devops-demo

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine image tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show deployment information
        run: |
          echo "================================="
          echo "DevOps Platform Deployment"
          echo "================================="
          echo "Host:"
          hostname

          echo "Runner:"
          echo "$RUNNER_NAME"

          echo "Image tag:"
          echo "${{ steps.version.outputs.tag }}"

          echo "Docker:"
          docker --version

          echo "Terraform:"
          terraform version

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="image_tag=${{ steps.version.outputs.tag }}"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="image_tag=${{ steps.version.outputs.tag }}"

      - name: Verify Server 1
        run: |
          echo "Testing Server 1..."
          curl --fail --retry 5 --retry-delay 2 \
            http://localhost:8001/health

      - name: Verify Server 2
        run: |
          echo "Testing Server 2..."
          curl --fail --retry 5 --retry-delay 2 \
            http://localhost:8002/health

      - name: Test Server 1 Hello API
        run: |
          curl --fail http://localhost:8001/hello

      - name: Test Server 2 Hello API
        run: |
          curl --fail http://localhost:8002/hello
