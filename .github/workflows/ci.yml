name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate application
        run: |
          python -m py_compile app/main.py

  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        server:
          - server1
          - server2
          - server3
          - server4
          - server5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.server }}
        run: |
          docker build \
            -f ${{ matrix.server }}/Dockerfile \
            -t ghcr.io/shaunsphere/hello-${{ matrix.server }}:${{ github.sha }} \
            -t ghcr.io/shaunsphere/hello-${{ matrix.server }}:latest \
            .
          docker push ghcr.io/shaunsphere/hello-${{ matrix.server }}:${{ github.sha }}
          docker push ghcr.io/shaunsphere/hello-${{ matrix.server }}:latest
