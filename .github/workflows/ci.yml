name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate application
        run: |
          python -m py_compile app/main.py

  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Server 1
        run: |
          docker build \
            -f server1/Dockerfile \
            -t ghcr.io/shaunsphere/hello-server1:${{ github.sha }} \
            -t ghcr.io/shaunsphere/hello-server1:latest \
            .

      - name: Push Server 1
        run: |
          docker push ghcr.io/shaunsphere/hello-server1:${{ github.sha }}
          docker push ghcr.io/shaunsphere/hello-server1:latest

      - name: Build Server 2
        run: |
          docker build \
            -f server2/Dockerfile \
            -t ghcr.io/shaunsphere/hello-server2:${{ github.sha }} \
            -t ghcr.io/shaunsphere/hello-server2:latest \
            .

      - name: Push Server 2
        run: |
          docker push ghcr.io/shaunsphere/hello-server2:${{ github.sha }}
          docker push ghcr.io/shaunsphere/hello-server2:latest
