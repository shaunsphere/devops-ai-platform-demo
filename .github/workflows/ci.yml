name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate application
        run: |
          python -m py_compile app/main.py

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Server 1
        run: |
          docker build \
            -f server1/Dockerfile \
            -t hello-server1:${{ github.sha }} .

      - name: Build Server 2
        run: |
          docker build \
            -f server2/Dockerfile \
            -t hello-server2:${{ github.sha }} .
