name: Deployment Summary

description: Verify deployed services and publish a deployment summary

author: Shaun Nguyen

inputs:
  image-tag:
    description: Docker image tag deployed
    required: true

  server1-url:
    description: Server 1 hello endpoint
    required: false
    default: http://localhost:8001/hello

  server2-url:
    description: Server 2 hello endpoint
    required: false
    default: http://localhost:8002/hello

  server3-url:
    description: Server 3 hello endpoint (AWS EC2)
    required: false
    default: ""

outputs:
  server1-status:
    description: Server 1 HTTP status

  server2-status:
    description: Server 2 HTTP status

  server3-status:
    description: Server 3 HTTP status

  deployment-status:
    description: Overall deployment status

runs:
  using: node24
  main: dist/index.js
