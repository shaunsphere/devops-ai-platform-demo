apiVersion: apps/v1
kind: Deployment
metadata:
  name: server4
  namespace: aws-apps
  labels:
    app: server4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server4
  template:
    metadata:
      labels:
        app: server4
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker
      containers:
        - name: server4
          image: ghcr.io/shaunsphere/hello-server4:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: server4-service
  namespace: aws-apps
spec:
  type: NodePort
  selector:
    app: server4
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30004
