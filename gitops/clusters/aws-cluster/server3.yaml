apiVersion: apps/v1
kind: Deployment
metadata:
  name: server3
  namespace: aws-apps
  labels:
    app: server3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server3
  template:
    metadata:
      labels:
        app: server3
    spec:
      containers:
        - name: server3
          image: ghcr.io/shaunsphere/hello-server3:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: server3-service
  namespace: aws-apps
spec:
  type: NodePort
  selector:
    app: server3
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30003
