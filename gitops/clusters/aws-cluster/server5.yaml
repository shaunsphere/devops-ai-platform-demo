apiVersion: apps/v1
kind: Deployment
metadata:
  name: server5
  namespace: aws-apps
  labels:
    app: server5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server5
  template:
    metadata:
      labels:
        app: server5
    spec:
      containers:
        - name: server5
          image: ghcr.io/shaunsphere/hello-server5:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: server5-service
  namespace: aws-apps
spec:
  type: NodePort
  selector:
    app: server5
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30005
