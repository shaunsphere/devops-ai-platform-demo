apiVersion: apps/v1
kind: Deployment
metadata:
  name: server2
  namespace: homelab-apps
  labels:
    app: server2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server2
  template:
    metadata:
      labels:
        app: server2
    spec:
      containers:
        - name: server2
          image: ghcr.io/shaunsphere/hello-server2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: server2-service
  namespace: homelab-apps
spec:
  type: NodePort
  selector:
    app: server2
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30002
