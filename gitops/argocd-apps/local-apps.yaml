apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-local-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shaunsphere/devops-ai-platform-demo.git
    targetRevision: main
    path: gitops/clusters/local-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: homelab-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
